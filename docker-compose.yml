version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fluxdesk
      POSTGRES_PASSWORD: fluxdesk_dev
      POSTGRES_DB: fluxdesk
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - '3000:3000'

volumes:
  pgdata:
