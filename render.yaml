# Render Blueprint — https://render.com/docs/infrastructure-as-code
# Deploys the FluxDesk Express API from ./backend (frontend stays on Vercel or elsewhere).
#
# After the service is created, set secrets in the Render dashboard (Environment):
#   DATABASE_URL, DIRECT_URL, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
#   ENCRYPTION_KEY, FRONTEND_URL (your production frontend origin, e.g. https://flux-desk.vercel.app)

services:
  - type: web
    name: fluxdesk-api
    runtime: node
    branch: main
    rootDir: backend
    buildCommand: npm ci && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
